<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encoder/Decoder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

    /* I Want when someone select the text the color of the text should be changed to light pink and a little bit transitions.*/
        *::selection {
            background-color: white;
            color: white;
            transition: background-color 0.2s ease;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }

        input, button {
            width: 80%;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .encode-btn {
            background-color: #4CAF50;
        }

        .decode-btn {
            background-color: #f44336;
        }

        .encode-btn:hover {
            background-color: #45a049;
        }

        .decode-btn:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Caesar Cipher Encoder/Decoder</h1>
        <label for="textInput">Enter Text:</label>
        <input type="text" id="textInput" placeholder="Enter text to encode/decode">
        <br>
        <button class="encode-btn" onclick="caesarCipher(3)">Encode</button>
        <button class="decode-btn" onclick="caesarCipher(-3)">Decode</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function caesarCipher(shift) {
            let inputText = document.getElementById("textInput").value;
            let outputText = '';
            
            // Loop through the input text and apply Caesar cipher
            for (let i = 0; i < inputText.length; i++) {
                let char = inputText[i];

                // Check if the character is a letter
                if (char.match(/[a-zA-Z]/)) {
                    let code = inputText.charCodeAt(i);
                    // Lowercase letters (a-z)
                    if (char >= 'a' && char <= 'z') {
                        // Apply Caesar shift
                        outputText += String.fromCharCode(((code - 97 + shift) % 26 + 26) % 26 + 97);
                    }
                    // Uppercase letters (A-Z)
                    else if (char >= 'A' && char <= 'Z') {
                        // Apply Caesar shift
                        outputText += String.fromCharCode(((code - 65 + shift) % 26 + 26) % 26 + 65);
                    }
                } else {
                    // If it's not a letter, just add the character as is
                    outputText += char;
                }
            }

            // Display the encoded/decoded result
            document.getElementById("result").textContent = "Result: " + outputText;
        }
    </script>

</body>
</html>
